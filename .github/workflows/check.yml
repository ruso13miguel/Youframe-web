# Revisa la página cada vez que se guarda un cambio (que no falten archivos ni haya errores de JavaScript).
# Cuando el hosting esté listo, aquí se puede agregar la publicación automática (ver docs/PUBLICAR.md).
name: Revisar página

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar archivos
        run: node scripts/check.mjs
